<div class="container">
    <section id="contact">
        <h2 style="text-align: center;">Get In Touch</h2>
        
        <!-- Professional contact form structure -->
        <form class="contact-form" action="#" method="POST">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required>

            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="e.g., Job Opportunity / Freelance Project" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Write your message here..." rows="6" required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </section>
</div>
